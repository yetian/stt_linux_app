[package]
name = "local-recorder-assistant"
version = "0.1.13"
description = "Privacy-first, offline transcription and summarization desktop app"
authors = ["Local Recorder Assistant"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "local_recorder_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
dirs = "5"
walkdir = "2.5"
reqwest = { version = "0.12", features = ["json"] }
symphonia = { version = "0.5", features = ["all"] }
whisper-rs = { version = "0.11", features = ["cuda"] }
ort = { version = "2.0.0-rc.13", features = ["cuda"] }
rustfft = "6"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
