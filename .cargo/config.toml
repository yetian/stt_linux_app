# whisper.cpp's CUDA objects are built without -fPIC. Rust 1.99 links with
# rust-lld, which refuses the resulting R_X86_64_PC32 relocations. Force the
# system GNU linker AND make the CUDA objects position independent.
[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd"]

[env]
# Initializes CMake's CMAKE_CUDA_FLAGS so nvcc compiles ggml-cuda with -fPIC.
CUDAFLAGS = "-Xcompiler=-fPIC"
